version: "3"

vars:
  REQUIRED_CODE_COVERAGE: "100"

tasks:
  default:
    desc: CI pipeline
    cmds:
      - task: ci

  fmt:
    desc: gofumpt (rewrites source)
    cmds:
      - gofumpt -l -w ./...

  test:
    desc: go test (race + coverage)
    cmds:
      - CGO_ENABLED=1 go test -race -count=1 -coverprofile=bin/coverage.out -covermode=atomic .

  covercheck:
    desc: coverage >= REQUIRED_CODE_COVERAGE
    vars:
      COV:
        sh: go tool cover -func=bin/coverage.out
    cmds:
      - cmd: |
          {{- $pctStr := last (regexFindAll "[0-9]+\\.?[0-9]*%" .COV -1) | trimSuffix "%" -}}
          {{- $req := .REQUIRED_CODE_COVERAGE | float64 -}}
          {{- $pct := $pctStr | float64 -}}
          echo "coverage: {{printf "%.1f" $pct}}%"
          {{- if lt $pct $req }}
          echo "FAIL: coverage {{printf "%.1f" $pct}}% < {{.REQUIRED_CODE_COVERAGE}}%"
          exit 1
          {{- end }}
        ignore_error: false
    internal: true

  ci:
    desc: format, tidy, lint, test, coverage
    cmds:
      - gofumpt -d . > /dev/null || ( echo "Code is not gofumpted, run task fmt" && exit 1 )
      - go mod tidy -diff
      - golangci-lint run ./...
      - task: test
      - task: covercheck
