version: "2"

linters:
  default: all
  enable:
    - gomodguard_v2
    - errcheck
  disable:
    - gomodguard
    - containedctx
    - depguard
    - dupl
    - err113
    - exhaustruct
    - funlen
    - gocyclo
    - inamedparam
    - ireturn
    - maintidx
    - mnd
    - nestif
    - noinlineerr
    - tagliatelle
    - wsl
    - wsl_v5
  exclusions:
    paths:
      - testdata/
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustruct_v5:
      ignore-patterns:
        - gopkg.in/yaml.v3.Node

formatters:
  enable:
    - gofumpt
